      <circle cx="9" cy="3" r="3.3" fill="#3A2414"/>
      <path d="M-8 14 q8 8 16 0" stroke="#B5654D" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <circle cx="-13" cy="10" r="4" fill="#E68AA0" opacity="0.45"/>
      <circle cx="13" cy="10" r="4" fill="#E68AA0" opacity="0.45"/>
    </g>

    <!-- ===== DAUGHTER (4) ===== -->
    <g transform="translate(286 268)">
      <path d="M-28 26 q-4 -34 20 -42 l16 0 q24 8 20 42 l16 70 -88 0 z" fill="#F2B5C4"/>
      <circle cx="0" cy="2" r="22" fill="#F6D7B8"/>
      <path d="M-22 -4 q0 -26 22 -26 q22 0 22 26 q0 8 -4 12 q-4 -16 -18 -16 q-14 0 -18 16 q-4 -4 -4 -12z" fill="#7A4A28"/>
