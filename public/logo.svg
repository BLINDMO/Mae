      <path d="M30 2 q12 30 2 70 l-8 -2 q10 -38 0 -66z" fill="#6B4423"/>
      <circle cx="-10" cy="4" r="3.5" fill="#3A2414"/>
      <circle cx="10" cy="4" r="3.5" fill="#3A2414"/>
      <path d="M-9 16 q9 8 18 0" stroke="#B5654D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="-16" cy="11" r="5" fill="#E68AA0" opacity="0.5"/>
      <circle cx="16" cy="11" r="5" fill="#E68AA0" opacity="0.5"/>
    </g>

    <!-- ===== DAD ===== -->
    <g transform="translate(346 188)">
      <path d="M-50 44 q-4 -58 34 -68 l32 0 q38 10 34 68 l-2 120 -96 0 z" fill="#3E7C8C"/>
      <rect x="-52" y="100" width="104" height="14" rx="7" fill="#2F606E"/>
      <path d="M-30 -18 q4 -28 30 -28 q26 0 30 28 q2 14 -4 22 l-52 0 q-6 -8 -4 -22z" fill="#4A2F1C"/>
      <circle cx="0" cy="8" r="33" fill="#F0C9A0"/>
      <path d="M-26 22 q26 26 52 0 q-6 22 -26 22 q-20 0 -26 -22z" fill="#4A2F1C"/>
      <circle cx="-12" cy="4" r="4" fill="#3A2414"/>
