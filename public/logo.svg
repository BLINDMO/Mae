<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Honeycutt family">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE3A1"/>
      <stop offset="0.55" stop-color="#F4B842"/>
      <stop offset="1" stop-color="#E89B1C"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FBF6B"/>
      <stop offset="1" stop-color="#6FA34C"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6DA"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="196" r="220" fill="url(#sun)"/>

    <!-- subtle honeycomb -->
    <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6" fill="none">
      <path d="M64 70 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
      <path d="M116 100 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
      <path d="M396 60 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
      <path d="M448 90 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
      <path d="M40 150 l26 15 v30 l-26 15 -26 -15 v-30 z"/>
    </g>

    <!-- ground -->
    <path d="M-20 400 q120 -38 276 -38 q156 0 276 38 v160 h-552 z" fill="url(#ground)"/>
    <ellipse cx="256" cy="452" rx="210" ry="26" fill="#000000" opacity="0.08"/>

    <!-- ===== MOM ===== -->
    <g transform="translate(150 196)">
      <path d="M-46 36 q-6 -56 30 -64 l32 0 q36 8 30 64 l-8 116 -76 0 z" fill="#C65D7B"/>
      <rect x="-44" y="92" width="88" height="14" rx="7" fill="#A84B66"/>
      <path d="M-26 36 q-10 -10 -8 -34 q4 -34 34 -34 q30 0 34 34 q2 24 -8 34 q-2 -22 -26 -22 q-24 0 -26 22z" fill="#6B4423"/>
