      <path d="M34 -2 l-8 -8 -8 8 8 8z" fill="#E85D75"/>
      <circle cx="-7" cy="1" r="3" fill="#3A2414"/>
      <circle cx="7" cy="1" r="3" fill="#3A2414"/>
      <path d="M-6 10 q6 7 12 0" stroke="#B5654D" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-12" cy="7" r="4" fill="#E86A85" opacity="0.5"/>
      <circle cx="12" cy="7" r="4" fill="#E86A85" opacity="0.5"/>
    </g>

    <!-- ===== PIT BULL (dark brown) ===== -->
    <g transform="translate(120 330)">
      <ellipse cx="40" cy="78" rx="58" ry="16" fill="#000000" opacity="0.10"/>
      <path d="M8 78 q-6 -44 22 -56 q14 -6 30 -2 q34 8 34 44 l0 14 -86 0z" fill="#4A2E1C"/>
      <path d="M30 80 l0 -16 6 0 0 16z M58 80 l0 -16 6 0 0 16z" fill="#3A2414"/>
      <circle cx="86" cy="34" r="26" fill="#4A2E1C"/>
      <path d="M64 16 q-8 -16 2 -22 q10 -2 10 14z" fill="#3A2414"/>
      <path d="M108 16 q8 -16 -2 -22 q-10 -2 -10 14z" fill="#3A2414"/>
      <ellipse cx="86" cy="42" rx="15" ry="12" fill="#C89B6E"/>
      <circle cx="86" cy="40" r="5.5" fill="#2A1A0F"/>
      <circle cx="79" cy="30" r="3.4" fill="#2A1A0F"/>
      <circle cx="95" cy="30" r="3.4" fill="#2A1A0F"/>
      <path d="M80 46 q6 6 12 0" stroke="#2A1A0F" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M96 70 q22 -2 24 -26" stroke="#4A2E1C" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>

    <!-- little hearts -->
    <path d="M250 92 c-6 -10 -22 -4 -16 8 c3 6 16 14 16 14 c0 0 13 -8 16 -14 c6 -12 -10 -18 -16 -8z" fill="#fff" opacity="0.85"/>
